<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Choose Your Role | AcademicMatch</title>

    <link rel="stylesheet" href="../style.css">

</head>


<body class="auth-page">


    <!-- Navigation -->

    <header>

        <nav class="navbar">

            <a href="../index.html" class="logo">
                AcademicMatch
            </a>

        </nav>

    </header>



    <!-- Role Selection -->

    <main class="role-container">

        <div class="role-header">

            <p class="section-label">
                ONE LAST STEP
            </p>

            <h1>
                How will you use AcademicMatch?
            </h1>

            <p>
                Choose the option that best describes you.
            </p>

        </div>


        <div class="role-grid">


            <!-- Student -->

            <button
                type="button"
                class="role-card"
                data-role="student"
            >

                <div class="role-icon">
                    🎓
                </div>

                <h2>
                    I'm a Student
                </h2>

                <p>
                    Build your academic profile, discover
                    internships and connect with companies.
                </p>

                <span class="role-action">
                    Continue as Student →
                </span>

            </button>



            <!-- Company -->

            <button
                type="button"
                class="role-card"
                data-role="company"
            >

                <div class="role-icon">
                    💼
                </div>

                <h2>
                    I'm a Company / Recruiter
                </h2>

                <p>
                    Create opportunities, discover talented
                    students and manage applications.
                </p>

                <span class="role-action">
                    Continue as Company →
                </span>

            </button>
            <!-- Academician -->

<button
    type="button"
    class="role-card"
    data-role="academician"
>

    <div class="role-icon">
        👨‍🏫
    </div>

    <h2>
        I'm an Academician
    </h2>

    <p>
        Share academic opportunities, faculty internships,
        training programs and research collaborations.
    </p>

    <span class="role-action">
        Continue as Academician →
    </span>

</button>


        </div>


        <a
            href="login.html"
            class="role-back"
        >
            ← Back to Login
        </a>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="../script.js"></script>

</body>

</html>
