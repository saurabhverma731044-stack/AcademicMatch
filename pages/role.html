
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Choose Your Role | AcademicMatch</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>


<body class="auth-page premium-role-page">


    <!-- Navigation -->

    <header class="login-header">

        <nav class="navbar">

            <a
                href="../index.html"
                class="logo"
            >
                AcademicMatch
            </a>

        </nav>

    </header>



    <!-- ROLE SELECTION -->

    <main class="premium-role-container">


        <!-- HEADER -->

        <div class="premium-role-header">

            <div class="login-badge">
                <span>✦</span>
                WELCOME TO ACADEMICA MATCH
            </div>

            <p class="section-label">
                ONE LAST STEP
            </p>

            <h1>
                How will you use
                <span>AcademicMatch?</span>
            </h1>

            <p>
                Choose your role to personalize your AcademicMatch
                experience.
            </p>

        </div>



        <!-- ROLE CARDS -->

        <div class="premium-role-grid">


            <!-- STUDENT -->

            <button
                type="button"
                class="premium-role-card"
                data-role="student"
            >

                <div class="premium-role-top">

                    <div class="premium-role-icon">
                        🎓
                    </div>

                    <span class="premium-role-number">
                        01
                    </span>

                </div>


                <div class="premium-role-content">

                    <p class="premium-role-label">
                        FOR STUDENTS
                    </p>

                    <h2>
                        I'm a Student
                    </h2>

                    <p>
                        Build your academic profile, discover
                        internships and connect with companies
                        looking for your skills.
                    </p>

                </div>


                <div class="premium-role-action">
                    Continue as Student
                    <span>→</span>
                </div>

            </button>



            <!-- COMPANY -->

            <button
                type="button"
                class="premium-role-card"
                data-role="company"
            >

                <div class="premium-role-top">

                    <div class="premium-role-icon">
                        💼
                    </div>

                    <span class="premium-role-number">
                        02
                    </span>

                </div>


                <div class="premium-role-content">

                    <p class="premium-role-label">
                        FOR COMPANIES
                    </p>

                    <h2>
                        I'm a Company
                    </h2>

                    <p>
                        Create opportunities, discover talented
                        students and manage your recruitment
                        process in one place.
                    </p>

                </div>


                <div class="premium-role-action">
                    Continue as Company
                    <span>→</span>
                </div>

            </button>



            <!-- ACADEMICIAN -->

            <button
                type="button"
                class="premium-role-card premium-role-wide"
                data-role="academician"
            >

                <div class="premium-role-top">

                    <div class="premium-role-icon">
                        👨‍🏫
                    </div>

                    <span class="premium-role-number">
                        03
                    </span>

                </div>


                <div class="premium-role-content">

                    <p class="premium-role-label">
                        FOR ACADEMICIANS
                    </p>

                    <h2>
                        I'm an Academician
                    </h2>

                    <p>
                        Share academic opportunities, faculty
                        internships, training programs and
                        research collaborations.
                    </p>

                </div>


                <div class="premium-role-action">
                    Continue as Academician
                    <span>→</span>
                </div>

            </button>


        </div>



        <!-- BACK -->

        <a
            href="login.html"
            class="premium-role-back"
        >
            ← Back to Login
        </a>


    </main>



    <!-- SCRIPTS -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../supabase-config.js"></script>

    <script src="../script.js"></script>


</body>

</html>
