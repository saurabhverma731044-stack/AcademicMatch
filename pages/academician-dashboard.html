<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Academician Dashboard | AcademicMatch</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <style>

        .opportunity-card {
            padding: 20px;
            margin-top: 15px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
        }

        .opportunity-card h3 {
            margin-bottom: 8px;
        }

        .opportunity-card p {
            margin-top: 7px;
            color: #64748b;
        }

        .type-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #eff6ff;
            color: #2563eb;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .applicant-card {
            padding: 20px;
            margin-top: 15px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background: #ffffff;
        }

        .applicant-card p {
            margin-top: 8px;
            color: #64748b;
        }

    </style>

</head>


<body class="auth-page">


<header>

    <nav class="navbar">

        <a
            href="../index.html"
            class="logo"
        >
            AcademicMatch
        </a>


        <div class="nav-buttons">

            <a
                href="academician-profile.html"
                class="btn btn-outline"
            >
                My Profile
            </a>


            <a
                href="academic-opportunity.html"
                class="btn btn-primary"
            >
                + Post Opportunity
            </a>


            <button
                id="logoutButton"
                class="btn btn-outline"
                type="button"
            >
                Logout
            </button>

        </div>

    </nav>

</header>



<main class="section">


    <div class="section-heading">

        <p class="section-label">
            ACADEMICIAN DASHBOARD
        </p>


        <h2 id="welcomeMessage">
            Welcome!
        </h2>


        <span>
            Explore and manage academia-industry opportunities.
        </span>

    </div>



    <div
        class="auth-card"
        style="
            max-width: 900px;
            margin: 0 auto;
        "
    >


        <!-- =========================
             MY OPPORTUNITIES
        ========================= -->

        <div class="auth-header">

            <h1 style="font-size: 24px;">
                Academic Opportunities
            </h1>

            <p>
                Opportunities posted by you.
            </p>

        </div>


        <div id="opportunityList">

            <p
                id="loadingMessage"
                style="
                    text-align: center;
                    color: #64748b;
                "
            >
                Loading opportunities...
            </p>

        </div>



        <!-- =========================
             APPLICANTS
        ========================= -->

        <h2 style="margin-top: 35px;">
            Applicants
        </h2>


        <div id="applicantList">

            <p style="
                text-align: center;
                color: #64748b;
                padding: 20px;
            ">
                Loading applicants...
            </p>

        </div>


    </div>


</main>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../supabase-config.js"></script>


<script>


// =========================================
// LOAD ACADEMICIAN OPPORTUNITIES
// =========================================

async function loadAcademicianDashboard() {

    const list =
        document.getElementById(
            "opportunityList"
        );


    try {

        const {
            data: { user },
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (userError || !user) {

            throw new Error(
                "Please log in first."
            );

        }


        document.getElementById(
            "welcomeMessage"
        ).textContent =
            "Welcome, Academician!";


        // =====================================
        // GET ONLY THIS ACADEMICIAN'S
        // OPPORTUNITIES
        // =====================================

        const {
            data: opportunities,
            error
        } =
            await supabaseClient
                .from("academic_opportunities")
                .select(`
                    id,
                    title,
                    opportunity_type,
                    description,
                    organization,
                    location,
                    deadline,
                    status,
                    created_at
                `)
                .eq(
                    "academician_id",
                    user.id
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (error) {

            throw error;

        }


        // =====================================
        // NO OPPORTUNITIES
        // =====================================

        if (
            !opportunities ||
            opportunities.length === 0
        ) {

            list.innerHTML = `

                <p style="
                    text-align: center;
                    color: #64748b;
                    padding: 30px;
                ">
                    You have not posted any academic
                    opportunities yet.
                </p>

            `;

            return;

        }


        list.innerHTML = "";


        // =====================================
        // DISPLAY OPPORTUNITIES
        // =====================================

        opportunities.forEach(
            function(opportunity) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "opportunity-card";


                card.innerHTML = `

                    <span class="type-badge">
                        ${
                            opportunity.opportunity_type ||
                            "Opportunity"
                        }
                    </span>


                    <h3>
                        ${
                            opportunity.title ||
                            "Untitled Opportunity"
                        }
                    </h3>


                    <p>
                        <strong>
                            Organization:
                        </strong>

                        ${
                            opportunity.organization ||
                            "Not specified"
                        }
                    </p>


                    <p>
                        <strong>
                            Description:
                        </strong>

                        ${
                            opportunity.description ||
                            "No description provided."
                        }
                    </p>


                    <p>
                        <strong>
                            Location:
                        </strong>

                        ${
                            opportunity.location ||
                            "Not specified"
                        }
                    </p>


                    <p>
                        <strong>
                            Deadline:
                        </strong>

                        ${
                            opportunity.deadline ||
                            "Not specified"
                        }
                    </p>


                    <p>
                        <strong>
                            Status:
                        </strong>

                        ${
                            opportunity.status ||
                            "open"
                        }
                    </p>

                    <div style="
    margin-top: 15px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
">

    <button
        type="button"
        class="btn btn-outline"
        onclick="deleteAcademicOpportunity('${opportunity.id}')"
    >
        Delete Opportunity
    </button>


    <button
    type="button"
    class="btn btn-outline"
    onclick="editAcademicOpportunity('${opportunity.id}')"
>
    Edit Opportunity
</button>

</div>

                `;


                list.appendChild(card);

            }
        );


    } catch (error) {

        console.error(
            "Academician dashboard error:",
            error
        );


        list.innerHTML = `

            <p style="
                text-align: center;
                color: #dc2626;
                padding: 30px;
            ">
                ${
                    error.message ||
                    "Unable to load opportunities."
                }
            </p>

        `;

    }

}



// =========================================
// LOAD ACADEMICIAN APPLICANTS
// =========================================

async function loadAcademicianApplicants() {

    const applicantList =
        document.getElementById(
            "applicantList"
        );


    try {

        const {
            data: { user },
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (userError || !user) {

            throw new Error(
                "Please log in first."
            );

        }


        // =====================================
        // GET ACADEMICIAN'S OPPORTUNITY IDS
        // =====================================

        const {
            data: opportunities,
            error: opportunityError
        } =
            await supabaseClient
                .from("academic_opportunities")
                .select("id, title")
                .eq(
                    "academician_id",
                    user.id
                );


        if (opportunityError) {

            throw opportunityError;

        }


        // =====================================
        // NO OPPORTUNITIES
        // =====================================

        if (
            !opportunities ||
            opportunities.length === 0
        ) {

            applicantList.innerHTML = `

                <p style="
                    color: #64748b;
                    text-align: center;
                    padding: 20px;
                ">
                    No applicants yet.
                </p>

            `;

            return;

        }


        const opportunityIds =
            opportunities.map(
                function(opportunity) {

                    return opportunity.id;

                }
            );


        // =====================================
        // GET APPLICATIONS
        // =====================================

        const {
            data: applications,
            error: applicationsError
        } =
            await supabaseClient
                .from("student_academic_applications")
                .select(`
                    id,
                    student_id,
                    student_name,
                    student_email,
                    status,
                    message,
                    applied_at,
                    opportunity_id
                `)
                .in(
                    "opportunity_id",
                    opportunityIds
                )
                .order(
                    "applied_at",
                    {
                        ascending: false
                    }
                );


        if (applicationsError) {

            throw applicationsError;

        }


        // =====================================
        // NO APPLICANTS
        // =====================================

        if (
            !applications ||
            applications.length === 0
        ) {

            applicantList.innerHTML = `

                <p style="
                    color: #64748b;
                    text-align: center;
                    padding: 20px;
                ">
                    No applicants yet.
                </p>

            `;

            return;

        }


        applicantList.innerHTML = "";


        // =====================================
        // DISPLAY APPLICANTS
        // =====================================

        applications.forEach(
            function(application) {

                const opportunity =
                    opportunities.find(
                        function(item) {

                            return (
                                item.id ===
                                application.opportunity_id
                            );

                        }
                    );


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "applicant-card";


                card.innerHTML = `

                    <h3>
                        ${
                            application.student_name ||
                            "Student"
                        }
                    </h3>


                    <p>
                        <strong>
                            Email:
                        </strong>

                        ${
                            application.student_email ||
                            "Not available"
                        }
                    </p>


                    <p>
                        <strong>
                            Opportunity:
                        </strong>

                        ${
                            opportunity?.title ||
                            "Opportunity"
                        }
                    </p>


                    <p>
                        <strong>
                            Status:
                        </strong>

                        <span style="
                            text-transform: capitalize;
                            ${
                                application.status === "accepted"
                                ? "color: #16a34a;"
                                : application.status === "rejected"
                                    ? "color: #dc2626;"
                                    : "color: #d97706;"
                            }
                        ">
                            ${
                                application.status ||
                                "pending"
                            }
                        </span>
                    </p>


                    ${
                        application.message
                        ?
                        `
                        <p>
                            <strong>
                                Message:
                            </strong>

                            ${
                                application.message
                            }
                        </p>
                        `
                        :
                        ""
                    }


                    ${
                        application.applied_at
                        ?
                        `
                        <p>
                            <strong>
                                Applied:
                            </strong>

                            ${
                                new Date(
                                    application.applied_at
                                ).toLocaleDateString()
                            }
                        </p>
                        `
                        :
                        ""
                    }


                    <!-- STUDENT PROFILE -->

                    <a
                        href="student-profile-view.html?id=${application.student_id}"
                        class="btn btn-outline"
                        style="
                            display: inline-block;
                            margin-top: 10px;
                        "
                    >
                        View Student Profile
                    </a>


                    <!-- MESSAGE -->

                    <a
                        href="messages.html?academic_application_id=${application.id}"
                        class="btn btn-primary"
                        style="
                            display: inline-block;
                            margin-top: 10px;
                            margin-left: 8px;
                        "
                    >
                        Message Student
                    </a>


                    <!-- STATUS BUTTONS -->

                    <div style="
                        margin-top: 15px;
                        display: flex;
                        gap: 10px;
                        flex-wrap: wrap;
                    ">

                        <button
                            type="button"
                            class="btn btn-primary"
                            onclick="
                                updateApplicationStatus(
                                    '${application.id}',
                                    'accepted'
                                )
                            "
                            ${
                                application.status === "accepted"
                                ? "disabled"
                                : ""
                            }
                        >
                            ${
                                application.status === "accepted"
                                ? "Accepted"
                                : "Accept"
                            }
                        </button>


                        <button
                            type="button"
                            class="btn btn-outline"
                            onclick="
                                updateApplicationStatus(
                                    '${application.id}',
                                    'rejected'
                                )
                            "
                            ${
                                application.status === "rejected"
                                ? "disabled"
                                : ""
                            }
                        >
                            ${
                                application.status === "rejected"
                                ? "Rejected"
                                : "Reject"
                            }
                        </button>

                    </div>

                `;


                applicantList.appendChild(card);

            }
        );


    } catch (error) {

        console.error(
            "Applicant loading error:",
            error
        );


        applicantList.innerHTML = `

            <p style="
                color: #dc2626;
                text-align: center;
                padding: 20px;
            ">
                ${
                    error.message ||
                    "Unable to load applicants."
                }
            </p>

        `;

    }

}



// =========================================
// UPDATE APPLICATION STATUS
// =========================================

async function updateApplicationStatus(
    applicationId,
    newStatus
) {

    try {

        const {
            data: { user },
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (userError || !user) {

            alert(
                "Please log in first."
            );

            return;

        }


        const {
            error
        } =
            await supabaseClient
                .from("student_academic_applications")
                .update({

                    status:
                        newStatus

                })
                .eq(
                    "id",
                    applicationId
                );


        if (error) {

            throw error;

        }


        alert(
            "Application status updated successfully."
        );


        await loadAcademicianDashboard();

        await loadAcademicianApplicants();


    } catch (error) {

        console.error(
            "Status update error:",
            error
        );


        alert(
            error.message ||
            "Unable to update application status."
        );

    }

}



// =========================================
// LOGOUT
// =========================================

document
    .getElementById(
        "logoutButton"
    )
    .addEventListener(
        "click",
        async function() {

            const {
                error
            } =
                await supabaseClient.auth.signOut();


            if (error) {

                console.error(
                    "Logout error:",
                    error
                );

                alert(
                    error.message ||
                    "Unable to logout."
                );

                return;

            }


            window.location.href =
                "../index.html";

        }
    );



// =========================================
// START
// =========================================

loadAcademicianDashboard();

loadAcademicianApplicants();


// =========================================
// DELETE ACADEMIC OPPORTUNITY
// =========================================

async function deleteAcademicOpportunity(opportunityId) {

    const confirmDelete = confirm(
        "Are you sure you want to delete this academic opportunity?"
    );

    if (!confirmDelete) {
        return;
    }

    try {

        const {
            data: { user },
            error: userError
        } = await supabaseClient.auth.getUser();

        if (userError || !user) {

            alert("Please log in first.");
            return;

        }


        // =====================================
        // DELETE OPPORTUNITY
        // =====================================

        const {
            data: deletedOpportunity,
            error: deleteError
        } = await supabaseClient
            .from("academic_opportunities")
            .delete()
            .eq("id", opportunityId)
            .eq("academician_id", user.id)
            .select("id");


        if (deleteError) {

            console.error(
                "Delete error:",
                deleteError
            );

            throw deleteError;

        }


        // =====================================
        // CHECK WHETHER ROW WAS ACTUALLY DELETED
        // =====================================

        if (
            !deletedOpportunity ||
            deletedOpportunity.length === 0
        ) {

            throw new Error(
                "Opportunity was not deleted. Check your Supabase RLS policy."
            );

        }


        // =====================================
        // SUCCESS
        // =====================================

        alert(
            "Academic opportunity deleted successfully!"
        );


        // Reload both sections
        await loadAcademicianDashboard();

        await loadAcademicianApplicants();


    } catch (error) {

        console.error(
            "Delete academic opportunity error:",
            error
        );

        alert(
            error.message ||
            "Unable to delete academic opportunity."
        );

    }

}

// =========================================
// EDIT ACADEMIC OPPORTUNITY
// =========================================

async function editAcademicOpportunity(opportunityId) {

    const newTitle = prompt(
        "Enter opportunity title:"
    );

    if (newTitle === null) {
        return;
    }

    const newType = prompt(
        "Enter opportunity type:"
    );

    if (newType === null) {
        return;
    }

    const newDescription = prompt(
        "Enter description:"
    );

    if (newDescription === null) {
        return;
    }

    const newOrganization = prompt(
        "Enter organization:"
    );

    if (newOrganization === null) {
        return;
    }

    const newLocation = prompt(
        "Enter location:"
    );

    if (newLocation === null) {
        return;
    }

    const newDeadline = prompt(
        "Enter deadline (YYYY-MM-DD):"
    );

    if (newDeadline === null) {
        return;
    }


    try {

        const {
            data: { user },
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (userError || !user) {

            alert("Please log in first.");

            return;

        }


        const {
            error
        } =
            await supabaseClient
                .from("academic_opportunities")
                .update({

                    title:
                        newTitle.trim(),

                    opportunity_type:
                        newType.trim(),

                    description:
                        newDescription.trim(),

                    organization:
                        newOrganization.trim(),

                    location:
                        newLocation.trim(),

                    deadline:
                        newDeadline || null

                })
                .eq(
                    "id",
                    opportunityId
                )
                .eq(
                    "academician_id",
                    user.id
                );


        if (error) {

            throw error;

        }


        alert(
            "Academic opportunity updated successfully!"
        );


        await loadAcademicianDashboard();

        await loadAcademicianApplicants();


    } catch (error) {

        console.error(
            "Edit academic opportunity error:",
            error
        );

        alert(
            error.message ||
            "Unable to update academic opportunity."
        );

    }

}

</script>


</body>

</html>
