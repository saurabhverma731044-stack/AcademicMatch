<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Academic Opportunity | AcademicMatch</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body class="auth-page">

<header>

    <nav class="navbar">

        <a href="../index.html" class="logo">
            AcademicMatch
        </a>

        <div class="nav-buttons">

            <a
                href="academician-dashboard.html"
                class="btn btn-outline"
            >
                ← Dashboard
            </a>

        </div>

    </nav>

</header>


<main class="auth-container">

    <div
    class="auth-card"
    style="
        max-width: 750px;
        margin: 40px auto;
        padding: 35px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    "
>

        <div class="auth-header">

            <p class="section-label">
                ACADEMIA–INDUSTRY COLLABORATION
            </p>

            <h1>
                Post Academic Opportunity
            </h1>

            <p>
                Publish internships, FDPs, training, consultancy,
                or research opportunities.
            </p>

        </div>


        <form id="academicOpportunityForm">


            <div class="form-group">

                <label>
                    Title
                </label>

                <input
                    type="text"
                    id="title"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Opportunity Type
                </label>

                <select
                    id="opportunityType"
                    required
                >

                    <option value="">
                        Select type
                    </option>

                    <option value="Faculty Internship">
                        Faculty Internship
                    </option>

                    <option value="Industrial Training">
                        Industrial Training
                    </option>

                    <option value="FDP">
                        Faculty Development Program (FDP)
                    </option>

                    <option value="Consultancy">
                        Consultancy
                    </option>

                    <option value="Research Project">
                        Research Project
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="description"
                    rows="5"
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label>
                    Organization
                </label>

                <input
                    type="text"
                    id="organization"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                >

            </div>


            <div class="form-group">

                <label>
                    Deadline
                </label>

                <input
                    type="date"
                    id="deadline"
                >

            </div>


            <p
                id="opportunityMessage"
                class="form-error"
            ></p>


            <button
                type="submit"
                class="btn btn-primary auth-submit"
            >
                Post Opportunity
            </button>

        </form>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../supabase-config.js"></script>


<script>

document
    .getElementById("academicOpportunityForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const message =
                document.getElementById(
                    "opportunityMessage"
                );

            message.textContent = "";


            const {
                data: { user },
                error: userError
            } =
                await supabaseClient.auth.getUser();


            if (userError || !user) {

                message.textContent =
                    "Please log in first.";

                return;

            }


            const {
                error
            } =
                await supabaseClient
                    .from("academic_opportunities")
                    .insert({

                        academician_id:
                            user.id,

                        title:
                            document.getElementById(
                                "title"
                            ).value.trim(),

                        opportunity_type:
                            document.getElementById(
                                "opportunityType"
                            ).value,

                        description:
                            document.getElementById(
                                "description"
                            ).value.trim(),

                        organization:
                            document.getElementById(
                                "organization"
                            ).value.trim(),

                        location:
                            document.getElementById(
                                "location"
                            ).value.trim(),

                        deadline:
                            document.getElementById(
                                "deadline"
                            ).value || null,

                        status:
                            "open"

                    });


            if (error) {

                console.error(
                    "Academic opportunity error:",
                    error
                );

                message.textContent =
                    error.message;

                return;

            }


            message.className = "";

            message.style.color =
                "#16a34a";

            message.textContent =
                "Academic opportunity posted successfully.";

            document
                .getElementById(
                    "academicOpportunityForm"
                )
                .reset();

        }
    );

</script>

</body>

</html>
